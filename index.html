<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Predictor & Live Elo - WC 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #1e40af; font-weight: 700; background-color: #eff6ff; }
        .tab-inactive { color: #64748b; font-weight: 500; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased pb-10">

    <div class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-50">
        <h1 class="text-xl font-bold text-center mb-3 flex items-center justify-center gap-2">
            🏆 WC 2026 <span class="text-blue-400">AI Predictor</span>
        </h1>
        <div class="max-w-md mx-auto">
            <div class="flex gap-2">
                <input type="password" id="apiKey" placeholder="Nhập API Key Google AI Studio..." 
                    class="w-full px-3 py-2 rounded text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs font-mono">
                <button onclick="saveApiKey()" class="bg-blue-600 hover:bg-blue-500 px-3 py-2 rounded font-bold text-xs whitespace-nowrap transition-colors shadow-md">
                    Lưu Key
                </button>
            </div>
            <div class="flex justify-between items-center mt-2">
                <p id="keyStatus" class="text-xs text-green-400 hidden">✅ Đã lưu Key!</p>
                <button onclick="hardReset()" class="text-xs text-red-400 hover:text-red-300 ml-auto flex items-center gap-1 bg-slate-800 px-2 py-1 rounded transition-colors border border-red-900 shadow-sm font-bold">
                    🔄 Bấm vào đây để Fix lỗi & Nạp Lịch FIFA
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4" id="match-list">
        <div class="flex justify-between items-center mb-4 bg-white p-3 rounded-lg shadow-sm border border-slate-200">
            <h2 class="text-md font-bold text-slate-700">📅 Lịch Thi Đấu (Giờ VN)</h2>
            <span class="text-xs bg-slate-800 text-white px-2 py-1 rounded font-bold shadow" id="matchCount">0/104 Trận</span>
        </div>
        <div id="matchesContainer"></div>
    </div>

    <div id="simulationModal" class="fixed inset-0 bg-slate-900 bg-opacity-60 hidden z-50 flex items-end sm:items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl h-5/6 sm:h-auto overflow-hidden flex flex-col transform transition-all shadow-2xl">
            
            <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                <h3 class="text-lg font-black text-slate-800" id="modalMatchTitle">Chi Tiết Trận Đấu</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-800 text-3xl font-bold w-8 h-8 flex items-center justify-center bg-slate-200 rounded-full">&times;</button>
            </div>

            <div class="flex border-b border-slate-200 bg-white">
                <button onclick="switchTab('ai')" id="tab-ai" class="w-1/2 py-3 text-sm text-center tab-active focus:outline-none">🤖 AI Dự Đoán</button>
                <button onclick="switchTab('result')" id="tab-result" class="w-1/2 py-3 text-sm text-center tab-inactive focus:outline-none hover:bg-slate-50 transition-colors">📝 Kết Quả & Elo</button>
            </div>

            <div class="p-5 overflow-y-auto flex-1 bg-white">
                <div id="panel-ai">
                    <div id="modalContentAI" class="mb-5"></div>
                    <button id="runBtn" onclick="runSimulation()" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-slate-800 flex justify-center items-center gap-2 transition-all border border-slate-700">
                        <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        Chạy Mô Phỏng AI Định Lượng
                    </button>
                    <div id="resultArea" class="mt-5 hidden">
                        <div class="flex items-center justify-center gap-2 text-blue-600 font-bold mb-4 hidden" id="loadingState">
                            <div class="loader"></div> <span id="loadingText" class="text-sm">Đang kết nối API...</span>
                        </div>
                        <div id="aiOutput" class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-sm leading-relaxed text-slate-700 shadow-inner"></div>
                    </div>
                </div>

                <div id="panel-result" class="hidden">
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-5 shadow-inner">
                        <div class="text-center text-xs font-bold text-slate-500 mb-3 uppercase tracking-wider">Nhập kết quả chung cuộc</div>
                        <div class="flex justify-between items-center gap-4">
                            <div class="w-2/5 flex flex-col items-center">
                                <span class="text-3xl mb-2" id="res-hFlag"></span>
                                <span class="font-bold text-slate-800 text-sm truncate w-full text-center" id="res-hName"></span>
                                <input type="number" id="inputHomeScore" class="w-16 h-12 text-center text-xl font-black bg-white border-2 border-slate-300 rounded-lg mt-2 focus:border-blue-500 focus:outline-none" min="0">
                            </div>
                            <div class="w-1/5 text-center text-2xl font-black text-slate-300">-</div>
                            <div class="w-2/5 flex flex-col items-center">
                                <span class="text-3xl mb-2" id="res-aFlag"></span>
                                <span class="font-bold text-slate-800 text-sm truncate w-full text-center" id="res-aName"></span>
                                <input type="number" id="inputAwayScore" class="w-16 h-12 text-center text-xl font-black bg-white border-2 border-slate-300 rounded-lg mt-2 focus:border-blue-500 focus:outline-none" min="0">
                            </div>
                        </div>
                    </div>
                    <button onclick="saveRealResult()" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-green-500 flex justify-center items-center gap-2 transition-all">
                        💾 Chốt Kết Quả & Nâng Cấp Elo
                    </button>
                    <div id="eloUpdateBox" class="mt-5 hidden bg-green-50 p-4 rounded-xl border border-green-200 text-sm text-green-800"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let teamElos = {};
        let matchesData = [];
        let currentMatchId = null;

        const baseTeams = [
            {n:"Mexico",f:"\uD83C\uDDF2\uD83C\uDDFD",e:1640}, {n:"Canada",f:"\uD83C\uDDE8\uD83C\uDDE6",e:1585}, {n:"USA",f:"\uD83C\uDDFA\uD83C\uDDF8",e:1680},
            {n:"Argentina",f:"\uD83C\uDDE6\uD83C\uDDF7",e:1865}, {n:"France",f:"\uD83C\uDDEB\uD83C\uDDF7",e:1850}, {n:"Brazil",f:"\uD83C\uDDE7\uD83C\uDDF7",e:1835},
            {n:"England",f:"\uD83C\uDFF4\uDB40\uDC67\uDB40\uDC62\uDB40\uDC65\uDB40\uDC6E\uDB40\uDC67\uDB40\uDC7F",e:1825}, {n:"Spain",f:"\uD83C\uDDEA\uD83C\uDDF8",e:1820}, {n:"Portugal",f:"\uD83C\uDDF5\uD83C\uDDF9",e:1790},
            {n:"Germany",f:"\uD83C\uDDE9\uD83C\uDDEA",e:1720}, {n:"Netherlands",f:"\uD83C\uDDF3\uD83C\uDDF1",e:1760}, {n:"Croatia",f:"\uD83C\uDDED\uD83C\uDDF7",e:1710},
            {n:"Uruguay",f:"\uD83C\uDDFA\uD83C\uDDFE",e:1675}, {n:"Japan",f:"\uD83C\uDDEF\uD83C\uDDF5",e:1630}, {n:"TBD",f:"\u2753",e:1500}
        ];

        function loadDataSafely() {
            try {
                teamElos = JSON.parse(localStorage.getItem('wc_team_elos'));
                if (!teamElos || Object.keys(teamElos).length === 0) throw new Error();
            } catch(e) {
                teamElos = {};
                baseTeams.forEach(t => teamElos[t.n] = t.e);
                localStorage.setItem('wc_team_elos', JSON.stringify(teamElos));
            }

            try {
                matchesData = JSON.parse(localStorage.getItem('wc_matches_data'));
                if (!Array.isArray(matchesData) || matchesData.length !== 104) throw new Error();
            } catch(e) {
                generateFifaSchedule();
            }
            renderMatchesUI();
        }

        function hardReset() {
            localStorage.removeItem('wc_team_elos');
            localStorage.removeItem('wc_matches_data');
            window.location.href = window.location.href.split('?')[0] + '?v=' + new Date().getTime();
        }

        // THUẬT TOÁN SINH LỊCH CHUẨN FIFA (104 TRẬN - GIỜ VIỆT NAM)
        function generateFifaSchedule() {
            matchesData = [];
            let id = 1;
            const venues = ["Azteca", "MetLife", "SoFi", "AT&T", "BC Place", "BMO Field", "Mercedes-Benz", "Lumen Field", "Levi's", "Hard Rock"];
            
            // 72 Trận Vòng Bảng (Từ 12/06/2026 đến 28/06/2026 giờ VN)
            let currentDate = new Date(2026, 5, 12, 2, 0); // 12/06/2026 02:00 VN
            
            for(let i=1; i<=72; i++) {
                const pad = n => n < 10 ? '0' + n : n;
                let timeStr = `${pad(currentDate.getHours())}:${pad(currentDate.getMinutes())} ${pad(currentDate.getDate())}/${pad(currentDate.getMonth() + 1)}/2026`;
                
                let hName = "TBD", hFlag = "❓", aName = "TBD", aFlag = "❓";
                let stageStr = `Vòng Bảng - Trận ${i}`;
                
                // Hardcode các trận mở màn của Host
                if(i===1) { hName = "Mexico"; hFlag = "🇲🇽"; stageStr = "Bảng A (Khai mạc MX)"; }
                if(i===2) { hName = "Canada"; hFlag = "🇨🇦"; stageStr = "Bảng B (Khai mạc CA)"; }
                if(i===3) { hName = "USA"; hFlag = "🇺🇸"; stageStr = "Bảng C (Khai mạc US)"; }
                
                matchesData.push({ id: id++, time: timeStr, stage: stageStr, venue: venues[i % venues.length], hName: hName, hFlag: hFlag, aName: aName, aFlag: aFlag, aiPred: null, realScore: null });
                
                // Tăng trung bình mỗi ngày 4-5 trận
                currentDate.setHours(currentDate.getHours() + 4);
                if(currentDate.getHours() > 10) { 
                    currentDate.setDate(currentDate.getDate() + 1); 
                    currentDate.setHours(1); // Reset về 01:00 sáng VN ngày hôm sau
                }
            }

            // Vòng Knockout
            const koStages = [
                {name: "Vòng 32 đội", count: 16, start: new Date(2026, 5, 29, 2, 0)}, // 29/06
                {name: "Vòng 16 đội", count: 8, start: new Date(2026, 6, 5, 2, 0)},  // 05/07
                {name: "Tứ Kết", count: 4, start: new Date(2026, 6, 10, 2, 0)},       // 10/07
                {name: "Bán Kết", count: 2, start: new Date(2026, 6, 15, 2, 0)},      // 15/07
                {name: "Tranh Hạng 3", count: 1, start: new Date(2026, 6, 19, 2, 0)}, // 19/07
                {name: "CHUNG KẾT", count: 1, start: new Date(2026, 6, 20, 2, 0)}     // 20/07
            ];

            koStages.forEach(stage => {
                let sDate = new Date(stage.start);
                for(let i=0; i<stage.count; i++) {
                    const pad = n => n < 10 ? '0' + n : n;
                    let timeStr = `${pad(sDate.getHours())}:${pad(sDate.getMinutes())} ${pad(sDate.getDate())}/${pad(sDate.getMonth() + 1)}/2026`;
                    
                    let venueStr = stage.name === "CHUNG KẾT" ? "MetLife Stadium, NY" : venues[id % venues.length];

                    matchesData.push({ id: id++, time: timeStr, stage: stage.name, venue: venueStr, hName: "TBD", hFlag: "❓", aName: "TBD", aFlag: "❓", aiPred: null, realScore: null });
                    
                    sDate.setHours(sDate.getHours() + 5);
                    if(sDate.getHours() > 10) { sDate.setDate(sDate.getDate() + 1); sDate.setHours(2); }
                }
            });

            localStorage.setItem('wc_matches_data', JSON.stringify(matchesData));
        }

        function renderMatchesUI() {
            const container = document.getElementById("matchesContainer");
            document.getElementById("matchCount").innerText = `104 Trận (Chuẩn FIFA)`;
            container.innerHTML = "";

            matchesData.forEach(m => {
                let currentHElo = teamElos[m.hName] ? Math.round(teamElos[m.hName]) : "-";
                let currentAElo = teamElos[m.aName] ? Math.round(teamElos[m.aName]) : "-";
                
                let scoreDisplay = m.realScore ? `<div class="text-xl font-black text-blue-800 bg-blue-100 px-3 py-1 rounded-full shadow-inner border border-blue-200">${m.realScore.h} - ${m.realScore.a}</div>` : `<div class="text-xs font-black text-slate-400 bg-slate-100 px-3 py-1 rounded-full border border-slate-200">VS</div>`;

                // TÍCH HỢP HIỂN THỊ DỮ LIỆU KÉP (AI & THỰC TẾ) TRÊN CÙNG MỘT CARD
                let predictionBox = '';
                if (m.aiPred || m.realScore) {
                    predictionBox = `<div class="mt-4 pt-3 border-t border-slate-100 flex flex-col gap-2">`;
                    
                    if (m.aiPred) {
                        let parsedAI = m.aiPred.replace(/<[^>]*>?/gm, ''); // Bỏ mã HTML để lấy text thuần
                        let summary = parsedAI.split('\n')[0] || "Đã có dự đoán định lượng."; 
                        predictionBox += `
                            <div class="flex gap-2 items-start bg-purple-50 p-2 rounded border border-purple-100">
                                <span class="text-lg">🤖</span>
                                <div>
                                    <div class="text-[10px] font-bold text-purple-600 uppercase tracking-wider">AI Dự Đoán</div>
                                    <div class="text-xs text-purple-900 line-clamp-2">${summary}</div>
                                </div>
                            </div>`;
                    }
                    if (m.realScore) {
                        predictionBox += `
                            <div class="flex gap-2 items-start bg-green-50 p-2 rounded border border-green-100 mt-1">
                                <span class="text-lg">✅</span>
                                <div>
                                    <div class="text-[10px] font-bold text-green-700 uppercase tracking-wider">Thực Tế</div>
                                    <div class="text-xs text-green-900">Trận đấu kết thúc (${m.realScore.h} - ${m.realScore.a}). Elo Ranking đã được cập nhật tự động.</div>
                                </div>
                            </div>`;
                    }
                    predictionBox += `</div>`;
                }

                const card = document.createElement("div");
                card.className = "bg-white p-4 rounded-xl shadow-sm mb-4 border-l-4 border-slate-800 cursor-pointer hover:shadow-md transition-all relative overflow-hidden";
                card.onclick = () => openModal(m.id);
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <div class="text-xs font-bold text-white ${m.realScore ? 'bg-green-600' : (m.aiPred ? 'bg-purple-600' : 'bg-slate-800')} px-2 py-0.5 rounded shadow-sm">Trận ${m.id}</div>
                        <div class="text-[10px] sm:text-xs font-semibold text-slate-500 flex items-center gap-2">
                            <span>🕒 ${m.time}</span>
                            <span class="text-blue-500">📍 ${m.venue}</span>
                        </div>
                    </div>
                    <div class="text-[10px] font-black text-slate-300 text-center mb-3 tracking-widest uppercase">${m.stage}</div>
                    <div class="flex justify-between items-center">
                        <div class="text-center w-2/5 flex flex-col items-center">
                            <span class="text-3xl mb-1 drop-shadow-sm">${m.hFlag}</span>
                            <div class="font-bold text-slate-800 text-sm truncate w-full">${m.hName}</div>
                            <div class="text-[10px] text-slate-400 font-mono mt-0.5 bg-slate-50 px-2 py-0.5 rounded">Elo: ${currentHElo}</div>
                        </div>
                        <div class="w-1/5 flex justify-center">${scoreDisplay}</div>
                        <div class="text-center w-2/5 flex flex-col items-center">
                            <span class="text-3xl mb-1 drop-shadow-sm">${m.aFlag}</span>
                            <div class="font-bold text-slate-800 text-sm truncate w-full">${m.aName}</div>
                            <div class="text-[10px] text-slate-400 font-mono mt-0.5 bg-slate-50 px-2 py-0.5 rounded">Elo: ${currentAElo}</div>
                        </div>
                    </div>
                    ${predictionBox}
                `;
                container.appendChild(card);
            });
        }

        function openModal(id) {
            currentMatchId = id;
            let m = matchesData.find(x => x.id === id);
            
            document.getElementById("simulationModal").classList.remove("hidden");
            switchTab('ai');

            let currentHElo = teamElos[m.hName] ? Math.round(teamElos[m.hName]) : "TBD";
            let currentAElo = teamElos[m.aName] ? Math.round(teamElos[m.aName]) : "TBD";

            document.getElementById("modalContentAI").innerHTML = `
                <div class="flex justify-between items-center bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <div class="text-center w-2/5 flex flex-col items-center"><span class="text-4xl">${m.hFlag}</span><div class="font-black text-slate-800 text-sm mt-2">${m.hName}</div><div class="text-xs text-blue-600 font-mono mt-1 bg-blue-50 px-2 rounded">Elo: ${currentHElo}</div></div>
                    <div class="font-black text-slate-200 w-1/5 text-center text-2xl">VS</div>
                    <div class="text-center w-2/5 flex flex-col items-center"><span class="text-4xl">${m.aFlag}</span><div class="font-black text-slate-800 text-sm mt-2">${m.aName}</div><div class="text-xs text-blue-600 font-mono mt-1 bg-blue-50 px-2 rounded">Elo: ${currentAElo}</div></div>
                </div>
            `;

            if(m.aiPred) {
                document.getElementById("resultArea").classList.remove("hidden");
                document.getElementById("aiOutput").innerHTML = `<div class="text-[10px] uppercase tracking-wider text-purple-600 font-bold mb-2 flex items-center gap-1"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg> Đã phân tích thành công</div><div class="text-slate-700">` + m.aiPred + `</div>`;
            } else {
                document.getElementById("resultArea").classList.add("hidden");
                document.getElementById("aiOutput").innerHTML = "";
            }

            document.getElementById("res-hFlag").innerText = m.hFlag;
            document.getElementById("res-hName").innerText = m.hName;
            document.getElementById("res-aFlag").innerText = m.aFlag;
            document.getElementById("res-aName").innerText = m.aName;
            
            document.getElementById("inputHomeScore").value = m.realScore ? m.realScore.h : "";
            document.getElementById("inputAwayScore").value = m.realScore ? m.realScore.a : "";
            document.getElementById("eloUpdateBox").classList.add("hidden");
        }

        function switchTab(tab) {
            if(tab === 'ai') {
                document.getElementById('tab-ai').className = "w-1/2 py-3 text-sm text-center tab-active focus:outline-none";
                document.getElementById('tab-result').className = "w-1/2 py-3 text-sm text-center tab-inactive focus:outline-none hover:bg-slate-50 transition-colors";
                document.getElementById('panel-ai').classList.remove('hidden');
                document.getElementById('panel-result').classList.add('hidden');
            } else {
                document.getElementById('tab-result').className = "w-1/2 py-3 text-sm text-center tab-active focus:outline-none";
                document.getElementById('tab-ai').className = "w-1/2 py-3 text-sm text-center tab-inactive focus:outline-none hover:bg-slate-50 transition-colors";
                document.getElementById('panel-result').classList.remove('hidden');
                document.getElementById('panel-ai').classList.add('hidden');
            }
        }

        function closeModal() { document.getElementById("simulationModal").classList.add("hidden"); }

        function saveRealResult() {
            let hScore = parseInt(document.getElementById("inputHomeScore").value);
            let aScore = parseInt(document.getElementById("inputAwayScore").value);
            
            if(isNaN(hScore) || isNaN(aScore)) { alert("Vui lòng nhập tỷ số hợp lệ (số nguyên)!"); return; }

            let m = matchesData.find(x => x.id === currentMatchId);
            if(m.hName === "TBD" || m.aName === "TBD") { alert("Trận đấu này chưa xác định đội tuyển, không thể lưu tỷ số!"); return; }
            
            m.realScore = { h: hScore, a: aScore };

            if(teamElos[m.hName] && teamElos[m.aName]) {
                let rH = teamElos[m.hName], rA = teamElos[m.aName];
                let eH = 1 / (1 + Math.pow(10, (rA - rH)/400)), eA = 1 - eH;
                let sH = hScore > aScore ? 1 : (hScore === aScore ? 0.5 : 0), sA = 1 - sH;
                
                let diff = Math.abs(hScore - aScore);
                let G = diff === 0 || diff === 1 ? 1 : (diff === 2 ? 1.5 : (11 + diff) / 8);

                let deltaH = 60 * G * (sH - eH), deltaA = 60 * G * (sA - eA);

                teamElos[m.hName] += deltaH; teamElos[m.aName] += deltaA;
                localStorage.setItem('wc_team_elos', JSON.stringify(teamElos));

                let box = document.getElementById("eloUpdateBox");
                box.classList.remove("hidden");
                box.innerHTML = `
                    <div class="font-bold mb-1">Cập nhật Elo thành công:</div>
                    <div class="flex justify-between border-b border-green-100 py-1"><span>${m.hName}:</span> <span>${Math.round(rH)} <span class="${deltaH > 0 ? 'text-green-600' : 'text-red-600'}">(${deltaH > 0 ? '+' : ''}${deltaH.toFixed(1)})</span> ➔ <strong>${Math.round(teamElos[m.hName])}</strong></span></div>
                    <div class="flex justify-between py-1"><span>${m.aName}:</span> <span>${Math.round(rA)} <span class="${deltaA > 0 ? 'text-green-600' : 'text-red-600'}">(${deltaA > 0 ? '+' : ''}${deltaA.toFixed(1)})</span> ➔ <strong>${Math.round(teamElos[m.aName])}</strong></span></div>
                `;
            }

            localStorage.setItem('wc_matches_data', JSON.stringify(matchesData));
            renderMatchesUI();
        }

        async function runSimulation() {
            const apiKey = document.getElementById("apiKey").value.trim();
            if (!apiKey) { alert("Vui lòng nhập API Key!"); return; }

            let m = matchesData.find(x => x.id === currentMatchId);
            if(m.hName === "TBD" || m.aName === "TBD") { alert("Trận đấu chưa xác định đủ 2 đội (TBD), AI không thể phân tích!"); return; }

            let currentHElo = teamElos[m.hName] ? Math.round(teamElos[m.hName]) : 1600;
            let currentAElo = teamElos[m.aName] ? Math.round(teamElos[m.aName]) : 1600;

            document.getElementById("resultArea").classList.remove("hidden");
            document.getElementById("loadingState").classList.remove("hidden");
            document.getElementById("aiOutput").innerHTML = "";
            document.getElementById("runBtn").disabled = true;

            const prompt = `Phân tích trận bóng đá theo phân phối Poisson và điểm Elo: Chủ nhà ${m.hName} (Elo ${currentHElo}) vs Khách ${m.aName} (Elo ${currentAElo}). 
            YÊU CẦU TRẢ LỜI NGẮN GỌN DƯỚI DẠNG HTML (sử dụng <b>, <br>): 
            - Dòng 1: <b>Nhận định:</b> [1 câu chốt sắc bén].
            - Dòng 2: <b>Tỷ lệ:</b> Thắng X% - Hòa Y% - Thua Z%. 
            - Dòng 3: <b>Tỷ số:</b> [Top 3 tỷ số cao nhất].`;

            // THUẬT TOÁN FALLBACK API SIÊU BỀN
            const modelsToTry = ['gemini-1.5-flash-latest', 'gemini-1.5-flash', 'gemini-pro'];
            let success = false;

            for (let i = 0; i < modelsToTry.length; i++) {
                const model = modelsToTry[i];
                document.getElementById("loadingText").innerText = `Đang kết nối: ${model}...`;
                
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });

                    const data = await response.json();
                    if(data.error) throw new Error(data.error.message);

                    // Xử lý text trả về, loại bỏ markdown markdown thừa nếu có
                    let rawText = data.candidates[0].content.parts[0].text;
                    let cleanText = rawText.replace(/```html/g, '').replace(/```/g, '').trim();
                    
                    m.aiPred = cleanText;
                    localStorage.setItem('wc_matches_data', JSON.stringify(matchesData));

                    document.getElementById("aiOutput").innerHTML = `<div class="text-[10px] uppercase tracking-wider text-purple-600 font-bold mb-2 flex items-center gap-1"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg> Xử lý thành công bởi: ${model}</div><div class="text-slate-700 leading-relaxed">` + cleanText + `</div>`;
                    
                    success = true;
                    renderMatchesUI(); 
                    break;
                } catch (error) {
                    console.log(`Lỗi API (${model}):`, error.message);
                }
            }

            if (!success) {
                document.getElementById("aiOutput").innerHTML = `<span class="text-red-500 font-bold">Thất bại kết nối!</span><br>API Key của bạn không có quyền truy cập. Hãy vào Google AI Studio, tạo một Key mới hoàn toàn (Create API Key in new project).`;
            }

            document.getElementById("loadingState").classList.add("hidden");
            document.getElementById("runBtn").disabled = false;
        }

        window.onload = () => {
            const savedKey = localStorage.getItem("gemini_wc_api_key");
            if(savedKey) document.getElementById("apiKey").value = savedKey;
            loadDataSafely();
        };

        function saveApiKey() {
            const key = document.getElementById("apiKey").value.trim();
            if(!key) return;
            localStorage.setItem("gemini_wc_api_key", key);
            document.getElementById("keyStatus").classList.remove("hidden");
            setTimeout(() => document.getElementById("keyStatus").classList.add("hidden"), 3000);
        }
    </script>
</body>
</html>
