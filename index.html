<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Predictor - WC 2026 (104 Matches)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 text-gray-800 font-sans antialiased pb-10">

    <div class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-50">
        <h1 class="text-xl font-bold text-center mb-3 flex items-center justify-center gap-2">
            🏆 WC 2026 <span class="text-blue-400">AI Predictor</span>
        </h1>
        <div class="max-w-md mx-auto">
            <div class="flex gap-2">
                <input type="password" id="apiKey" placeholder="Nhập Google API Key..." 
                    class="w-full px-4 py-2 rounded text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm font-mono">
                <button onclick="saveApiKey()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded font-bold text-sm whitespace-nowrap transition-colors shadow-md">
                    Lưu Key
                </button>
            </div>
            <div class="flex justify-between items-center mt-2">
                <p id="keyStatus" class="text-xs text-green-400 hidden">✅ Đã lưu Key vào thiết bị!</p>
                <button onclick="clearCacheAndReload()" class="text-xs text-red-400 hover:text-red-300 ml-auto flex items-center gap-1">
                    🔄 Xóa Cache iPad
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4" id="match-list">
        <div class="flex justify-between items-center mb-4 bg-white p-3 rounded-lg shadow-sm">
            <h2 class="text-md font-bold text-slate-700">📅 Lịch Thi Đấu (Giờ VN)</h2>
            <span class="text-xs bg-slate-800 text-white px-2 py-1 rounded font-bold shadow" id="matchCount">Đang nạp dữ liệu...</span>
        </div>
        <div id="matchesContainer"></div>
    </div>

    <div id="simulationModal" class="fixed inset-0 bg-slate-900 bg-opacity-60 hidden z-50 flex items-end sm:items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-6 h-5/6 sm:h-auto overflow-y-auto transform transition-all relative shadow-2xl">
            <div class="flex justify-between items-center mb-4 sticky top-0 bg-white z-10 pb-3 border-b border-slate-100">
                <h3 class="text-lg font-black text-slate-800">🤖 Máy Phân Tích Định Lượng</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-800 text-3xl font-bold rounded-full w-8 h-8 flex items-center justify-center bg-slate-100">&times;</button>
            </div>
            
            <div id="modalContent" class="mb-5"></div>

            <button id="runBtn" onclick="runSimulation()" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-slate-800 flex justify-center items-center gap-2 transition-all">
                <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                Chạy 10,000 Mô phỏng Monte Carlo
            </button>

            <div id="resultArea" class="mt-5 hidden">
                <div class="flex items-center justify-center gap-2 text-blue-600 font-bold mb-4 hidden" id="loadingState">
                    <div class="loader"></div> <span id="loadingText" class="text-sm">Đang kết nối model...</span>
                </div>
                <div id="aiOutput" class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-sm leading-relaxed text-slate-700 shadow-inner"></div>
            </div>
        </div>
    </div>

    <script>
        function clearCacheAndReload() {
            localStorage.clear();
            window.location.href = window.location.href.split('?')[0] + '?v=' + new Date().getTime();
        }

        window.onload = () => {
            const savedKey = localStorage.getItem("gemini_wc_api_key");
            if(savedKey) document.getElementById("apiKey").value = savedKey;
            generateFull104Matches();
        };

        function saveApiKey() {
            const key = document.getElementById("apiKey").value.trim();
            if(!key) { alert("Vui lòng nhập Key!"); return; }
            localStorage.setItem("gemini_wc_api_key", key);
            document.getElementById("keyStatus").classList.remove("hidden");
            setTimeout(() => document.getElementById("keyStatus").classList.add("hidden"), 3000);
        }

        // Đã sử dụng Unicode Escape \u thay cho Emoji trực tiếp để chống lỗi BiDi của GitHub
        const teams = {
            "A": [{n:"Mexico",f:"\uD83C\uDDF2\uD83C\uDDFD",e:1650}, {n:"South Africa",f:"\uD83C\uDDFF\uD83C\uDDE6",e:1410}, {n:"South Korea",f:"\uD83C\uDDF0\uD83C\uDDF7",e:1560}, {n:"Czechia",f:"\uD83C\uDDE8\uD83C\uDDFF",e:1510}],
            "B": [{n:"Canada",f:"\uD83C\uDDE8\uD83C\uDDE6",e:1580}, {n:"Bosnia",f:"\uD83C\uDDE7\uD83C\uDDE6",e:1450}, {n:"Qatar",f:"\uD83C\uDDF6\uD83C\uDDE6",e:1440}, {n:"Switzerland",f:"\uD83C\uDDE8\uD83C\uDDED",e:1600}],
            "C": [{n:"Brazil",f:"\uD83C\uDDE7\uD83C\uDDF7",e:1830}, {n:"Morocco",f:"\uD83C\uDDF2\uD83C\uDDE6",e:1660}, {n:"Haiti",f:"\uD83C\uDDED\uD83C\uDDF9",e:1350}, {n:"Scotland",f:"\uD83C\uDFF4\uDB40\uDC67\uDB40\uDC62\uDB40\uDC73\uDB40\uDC63\uDB40\uDC74\uDB40\uDC7F",e:1490}],
            "D": [{n:"USA",f:"\uD83C\uDDFA\uD83C\uDDF8",e:1670}, {n:"Paraguay",f:"\uD83C\uDDF5\uD83C\uDDFE",e:1480}, {n:"Australia",f:"\uD83C\uDDE6\uD83C\uDDFA",e:1540}, {n:"Turkey",f:"\uD83C\uDDF9\uD83C\uDDF7",e:1520}],
            "E": [{n:"Germany",f:"\uD83C\uDDE9\uD83C\uDDEA",e:1710}, {n:"Curacao",f:"\uD83C\uDDE8\uD83C\uDDFC",e:1320}, {n:"Ivory Coast",f:"\uD83C\uDDE8\uD83C\uDDEE",e:1510}, {n:"Ecuador",f:"\uD83C\uDDEA\uD83C\uDDE8",e:1580}],
            "F": [{n:"Netherlands",f:"\uD83C\uDDF3\uD83C\uDDF1",e:1750}, {n:"Japan",f:"\uD83C\uDDEF\uD83C\uDDF5",e:1620}, {n:"Sweden",f:"\uD83C\uDDF8\uD83C\uDDEA",e:1690}, {n:"Tunisia",f:"\uD83C\uDDF9\uD83C\uDDF3",e:1500}],
            "G": [{n:"Belgium",f:"\uD83C\uDDE7\uD83C\uDDEA",e:1790}, {n:"Egypt",f:"\uD83C\uDDEA\uD83C\uDDEC",e:1500}, {n:"Iran",f:"\uD83C\uDDEE\uD83C\uDDF7",e:1530}, {n:"New Zealand",f:"\uD83C\uDDF3\uD83C\uDDFF",e:1390}],
            "H": [{n:"Spain",f:"\uD83C\uDDEA\uD83C\uDDF8",e:1810}, {n:"Cape Verde",f:"\uD83C\uDDE8\uD83C\uDDFB",e:1420}, {n:"Saudi Arabia",f:"\uD83C\uDDF8\uD83C\uDDE6",e:1440}, {n:"Uruguay",f:"\uD83C\uDDFA\uD83C\uDDFE",e:1660}],
            "I": [{n:"France",f:"\uD83C\uDDEB\uD83C\uDDF7",e:1840}, {n:"Senegal",f:"\uD83C\uDDF8\uD83C\uDDF3",e:1610}, {n:"Iraq",f:"\uD83C\uDDEE\uD83C\uDDF6",e:1430}, {n:"Norway",f:"\uD83C\uDDF3\uD83C\uDDF4",e:1570}],
            "J": [{n:"Argentina",f:"\uD83C\uDDE6\uD83C\uDDF7",e:1850}, {n:"Algeria",f:"\uD83C\uDDE9\uD83C\uDDFF",e:1550}, {n:"Austria",f:"\uD83C\uDDE6\uD83C\uDDF9",e:1590}, {n:"Jordan",f:"\uD83C\uDDEF\uD83C\uDDF4",e:1460}],
            "K": [{n:"Portugal",f:"\uD83C\uDDF5\uD83C\uDDF9",e:1780}, {n:"DR Congo",f:"\uD83C\uDDE8\uD83C\uDDE9",e:1470}, {n:"Uzbekistan",f:"\uD83C\uDDFA\uD83C\uDDFF",e:1490}, {n:"Colombia",f:"\uD83C\uDDE8\uD83C\uDDF4",e:1650}],
            "L": [{n:"England",f:"\uD83C\uDFF4\uDB40\uDC67\uDB40\uDC62\uDB40\uDC65\uDB40\uDC6E\uDB40\uDC67\uDB40\uDC7F",e:1820}, {n:"Croatia",f:"\uD83C\uDDED\uD83C\uDDF7",e:1720}, {n:"Ghana",f:"\uD83C\uDDEC\uD83C\uDDED",e:1480}, {n:"Panama",f:"\uD83C\uDDF5\uD83C\uDDE6",e:1450}]
        };

        const venues = ["Estadio Azteca", "MetLife Stadium", "SoFi Stadium", "AT&T Stadium", "BC Place", "BMO Field", "Mercedes-Benz", "Lumen Field"];
        const matches = [];

        function generateFull104Matches() {
            let id = 1;
            let startDate = new Date(2026, 5, 12, 2, 0);

            for(let round=0; round<3; round++) {
                Object.keys(teams).forEach(groupName => {
                    let t = teams[groupName];
                    let pairs = round === 0 ? [[0,1], [2,3]] : round === 1 ? [[0,2], [1,3]] : [[0,3], [1,2]];
                    
                    pairs.forEach(pair => {
                        let t1 = t[pair[0]], t2 = t[pair[1]];
                        let v = venues[id % venues.length];
                        let timeStr = startDate.toLocaleString('vi-VN', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
                        
                        matches.push({
                            id: id++, time: timeStr, stage: `Vòng Bảng - Bảng ${groupName}`, venue: v,
                            hName: t1.n, hFlag: t1.f, hElo: t1.e, aName: t2.n, aFlag: t2.f, aElo: t2.e
                        });
                        startDate.setHours(startDate.getHours() + 3);
                    });
                });
            }

            const koStages = [
                {name: "Vòng 1/16 (Round of 32)", count: 16},
                {name: "Vòng 1/8 (Round of 16)", count: 8},
                {name: "Tứ Kết (Quarter-Finals)", count: 4},
                {name: "Bán Kết (Semi-Finals)", count: 2},
                {name: "Tranh Hạng 3", count: 1},
                {name: "CHUNG KẾT (FINAL)", count: 1}
            ];

            koStages.forEach(stage => {
                startDate.setDate(startDate.getDate() + 1);
                for(let i=0; i<stage.count; i++) {
                    let v = venues[id % venues.length];
                    let timeStr = startDate.toLocaleString('vi-VN', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
                    matches.push({
                        id: id++, time: timeStr, stage: stage.name, venue: v,
                        hName: `Đội thắng trận ${id-stage.count-i-1}`, hFlag: "\u2753", hElo: 1600, 
                        aName: `Đội thắng trận ${id-stage.count-i}`, aFlag: "\u2753", aElo: 1600
                    });
                    startDate.setHours(startDate.getHours() + 4);
                }
            });

            renderMatchesUI();
        }

        function renderMatchesUI() {
            const container = document.getElementById("matchesContainer");
            document.getElementById("matchCount").innerText = `${matches.length}/104 Trận`;
            container.innerHTML = "";

            matches.forEach(m => {
                const card = document.createElement("div");
                card.className = "bg-white p-4 rounded-xl shadow-sm mb-3 border-l-4 border-slate-800 cursor-pointer hover:bg-slate-50 transition-colors";
                card.onclick = () => openModal(m);
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-3 border-b border-slate-100 pb-2">
                        <div class="text-xs font-bold text-white bg-blue-600 px-2 py-0.5 rounded shadow-sm">Trận ${m.id}</div>
                        <div class="text-[10px] sm:text-xs font-semibold text-slate-500 flex flex-col items-end">
                            <span>🕒 ${m.time}</span>
                            <span class="text-blue-500">📍 ${m.venue}</span>
                        </div>
                    </div>
                    <div class="text-xs font-black text-slate-300 text-center mb-2 tracking-widest uppercase">${m.stage}</div>
                    <div class="flex justify-between items-center">
                        <div class="text-center w-2/5 flex flex-col items-center">
                            <span class="text-2xl mb-1">${m.hFlag}</span>
                            <div class="font-bold text-slate-800 text-sm truncate w-full">${m.hName}</div>
                            <div class="text-[10px] text-slate-400 font-mono">Elo: ${m.hElo}</div>
                        </div>
                        <div class="text-xs font-black text-slate-200 w-1/5 text-center bg-slate-50 rounded-full py-1">VS</div>
                        <div class="text-center w-2/5 flex flex-col items-center">
                            <span class="text-2xl mb-1">${m.aFlag}</span>
                            <div class="font-bold text-slate-800 text-sm truncate w-full">${m.aName}</div>
                            <div class="text-[10px] text-slate-400 font-mono">Elo: ${m.aElo}</div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        let currentMatch = null;

        function openModal(match) {
            currentMatch = match;
            document.getElementById("simulationModal").classList.remove("hidden");
            document.getElementById("resultArea").classList.add("hidden");
            document.getElementById("modalContent").innerHTML = `
                <div class="flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div class="text-center w-2/5 flex flex-col items-center">
                        <span class="text-3xl">${match.hFlag}</span>
                        <div class="font-bold text-slate-800 text-sm mt-1">${match.hName}</div>
                    </div>
                    <div class="font-black text-slate-300 w-1/5 text-center text-xl">VS</div>
                    <div class="text-center w-2/5 flex flex-col items-center">
                        <span class="text-3xl">${match.aFlag}</span>
                        <div class="font-bold text-slate-800 text-sm mt-1">${match.aName}</div>
                    </div>
                </div>
            `;
        }

        function closeModal() { document.getElementById("simulationModal").classList.add("hidden"); }

        async function runSimulation() {
            const apiKey = document.getElementById("apiKey").value.trim();
            if (!apiKey) { alert("Vui lòng nhập API Key!"); return; }

            document.getElementById("resultArea").classList.remove("hidden");
            document.getElementById("loadingState").classList.remove("hidden");
            document.getElementById("aiOutput").innerHTML = "";
            document.getElementById("runBtn").disabled = true;
            document.getElementById("runBtn").classList.add("opacity-50");

            const prompt = `Phân tích trận bóng đá bằng Elo rating: Chủ nhà: ${currentMatch.hName} (Elo ${currentMatch.hElo}) vs Khách: ${currentMatch.aName} (Elo ${currentMatch.aElo}). Định dạng: 1. Tỷ lệ Thắng/Hòa/Thua (%). 2. Top 3 tỷ số khả thi. 3. Một câu chốt định lượng.`;

            const modelsToTry = ['gemini-1.5-flash', 'gemini-1.5-pro', 'gemini-1.0-pro', 'gemini-pro'];
            let success = false;

            for (let i = 0; i < modelsToTry.length; i++) {
                const model = modelsToTry[i];
                document.getElementById("loadingText").innerText = `Đang thử gọi model: ${model}...`;
                
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });

                    const data = await response.json();
                    if(data.error) throw new Error(data.error.message);

                    let resultText = data.candidates[0].content.parts[0].text;
                    resultText = resultText.replace(/\*\*(.*?)\*\*/g, '<strong class="text-slate-900">$1</strong>')
                                           .replace(/\*/g, '<br>•').replace(/\n/g, '<br>');

                    document.getElementById("aiOutput").innerHTML = `<div class="text-xs text-blue-500 mb-2 font-mono">Đã xử lý thành công bởi: ${model}</div>` + resultText;
                    success = true;
                    break;
                } catch (error) {
                    console.log(`Lỗi với model ${model}:`, error.message);
                }
            }

            if (!success) {
                document.getElementById("aiOutput").innerHTML = `<span class="text-red-500 font-bold">Thất bại toàn bộ!</span><br>API Key của bạn không có quyền truy cập bất kỳ mô hình ngôn ngữ nào. Vui lòng tạo một API Key mới.`;
            }

            document.getElementById("loadingState").classList.add("hidden");
            document.getElementById("runBtn").disabled = false;
            document.getElementById("runBtn").classList.remove("opacity-50");
        }
    </script>
</body>
</html>
