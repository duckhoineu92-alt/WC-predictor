<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Predictor - WC 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tùy chỉnh thanh cuộn cho mượt mà trên mobile */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">

    <div class="bg-blue-900 text-white p-4 shadow-md sticky top-0 z-50">
        <h1 class="text-xl font-bold text-center mb-2">⚽ WC 2026 AI Predictor</h1>
        <div class="max-w-md mx-auto relative">
            <input type="password" id="apiKey" placeholder="Nhập Google AI Studio API Key..." 
                class="w-full px-4 py-2 rounded text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
    </div>

    <div class="max-w-md mx-auto p-4" id="match-list">
        <h2 class="text-lg font-bold mb-4 text-gray-700">📅 Timeline Trận Đấu</h2>
        </div>

    <div id="simulationModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-end sm:items-center justify-center">
        <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-6 h-5/6 sm:h-auto overflow-y-auto transform transition-all">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-gray-800" id="modalTitle">Phân Tích Trận Đấu</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-800 text-2xl font-bold">&times;</button>
            </div>
            
            <div id="modalContent" class="mb-6">
                </div>

            <button id="runBtn" onclick="runSimulation()" class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white font-bold py-3 rounded-xl shadow-lg hover:opacity-90 flex justify-center items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                Chạy 10,000 Mô phỏng (Monte Carlo)
            </button>

            <div id="resultArea" class="mt-6 hidden">
                <div class="flex items-center justify-center gap-2 text-blue-600 font-bold mb-4 hidden" id="loadingState">
                    <div class="loader"></div> Đang gọi AI xử lý...
                </div>
                <div id="aiOutput" class="bg-gray-50 p-4 rounded-xl border border-gray-200 text-sm leading-relaxed text-gray-700">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Cấu trúc dữ liệu 104 trận (Bạn có thể thêm đủ 104 trận vào mảng này)
        const matches = [
            { id: 1, time: "11/06/2026 19:00", home: "USA", homeElo: 1650, away: "Vietnam", awayElo: 1250 },
            { id: 2, time: "12/06/2026 02:00", home: "Mexico", homeElo: 1620, away: "Angola", awayElo: 1310 },
            { id: 3, time: "12/06/2026 05:00", home: "Brazil", homeElo: 1810, away: "Canada", awayElo: 1590 }
        ];

        let currentMatch = null;

        // 2. Hàm Render danh sách trận đấu
        function renderMatches() {
            const list = document.getElementById("match-list");
            matches.forEach(m => {
                const card = document.createElement("div");
                card.className = "bg-white p-4 rounded-xl shadow-sm mb-4 border border-gray-100 cursor-pointer hover:shadow-md transition-shadow";
                card.onclick = () => openModal(m);
                card.innerHTML = `
                    <div class="text-xs font-bold text-gray-400 mb-2">Trận ${m.id} • ${m.time} (Giờ VN)</div>
                    <div class="flex justify-between items-center">
                        <div class="text-center w-2/5">
                            <div class="font-bold text-gray-800">${m.home}</div>
                            <div class="text-xs text-blue-500">Elo: ${m.homeElo}</div>
                        </div>
                        <div class="text-sm font-black text-gray-300 w-1/5 text-center">VS</div>
                        <div class="text-center w-2/5">
                            <div class="font-bold text-gray-800">${m.away}</div>
                            <div class="text-xs text-blue-500">Elo: ${m.awayElo}</div>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        // 3. Xử lý UI Modal
        function openModal(match) {
            currentMatch = match;
            document.getElementById("simulationModal").classList.remove("hidden");
            document.getElementById("resultArea").classList.add("hidden");
            document.getElementById("modalContent").innerHTML = `
                <div class="flex justify-between items-center bg-gray-50 p-4 rounded-lg">
                    <div class="text-center"><div class="text-lg font-bold">${match.home}</div></div>
                    <div class="font-black text-gray-400">VS</div>
                    <div class="text-center"><div class="text-lg font-bold">${match.away}</div></div>
                </div>
            `;
        }

        function closeModal() {
            document.getElementById("simulationModal").classList.add("hidden");
        }

        // 4. Xử lý Logic gọi AI bằng Fetch API (Serverless)
        async function runSimulation() {
            const apiKey = document.getElementById("apiKey").value;
            if (!apiKey) {
                alert("Vui lòng nhập API Key của Google AI Studio ở góc trên cùng!");
                return;
            }

            document.getElementById("resultArea").classList.remove("hidden");
            document.getElementById("loadingState").classList.remove("hidden");
            document.getElementById("aiOutput").innerHTML = "";
            document.getElementById("runBtn").disabled = true;

            const prompt = `Bạn là một AI Data Scientist. Phân tích kết quả trận bóng đá dựa trên Elo rating:
            Đội nhà: ${currentMatch.home} (Elo ${currentMatch.homeElo})
            Đội khách: ${currentMatch.away} (Elo ${currentMatch.awayElo})
            Hãy chạy thuật toán Poisson và giả lập Monte Carlo. Trả về format định dạng rõ ràng gồm:
            1. Tỷ lệ Thắng / Hòa / Thua (dạng phần trăm).
            2. Top 3 tỷ số có xác suất xảy ra cao nhất.
            3. Chốt 1 câu nhận định sắc bén.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                if(data.error) throw new Error(data.error.message);

                // Format lại text từ Markdown sang HTML cơ bản
                let resultText = data.candidates[0].content.parts[0].text;
                resultText = resultText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                resultText = resultText.replace(/\*/g, '<br>•');
                resultText = resultText.replace(/\n/g, '<br>');

                document.getElementById("aiOutput").innerHTML = resultText;
            } catch (error) {
                document.getElementById("aiOutput").innerHTML = `<span class="text-red-500 font-bold">Lỗi:</span> ${error.message}`;
            } finally {
                document.getElementById("loadingState").classList.add("hidden");
                document.getElementById("runBtn").disabled = false;
            }
        }

        // Khởi tạo
        renderMatches();
    </script>
</body>
</html>
