<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Predictor & Live Elo - WC 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #1e40af; font-weight: 700; }
        .tab-inactive { color: #64748b; font-weight: 500; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased pb-10">

    <div class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-50">
        <h1 class="text-xl font-bold text-center mb-3 flex items-center justify-center gap-2">
            🏆 WC 2026 <span class="text-blue-400">Master Data</span>
        </h1>
        <div class="max-w-md mx-auto">
            <div class="flex gap-2">
                <input type="password" id="apiKey" placeholder="Nhập Key (Tạo New Project trên AI Studio)..." 
                    class="w-full px-3 py-2 rounded text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs font-mono">
                <button onclick="saveApiKey()" class="bg-blue-600 hover:bg-blue-500 px-3 py-2 rounded font-bold text-xs whitespace-nowrap transition-colors shadow-md">
                    Lưu Key
                </button>
            </div>
            <div class="flex justify-between items-center mt-2">
                <p id="keyStatus" class="text-xs text-green-400 hidden">✅ Đã lưu Key!</p>
                <button onclick="resetData()" class="text-xs text-red-400 hover:text-red-300 ml-auto flex items-center gap-1">
                    🔄 Reset Data & Xóa Cache
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4" id="match-list">
        <div class="flex justify-between items-center mb-4 bg-white p-3 rounded-lg shadow-sm border border-slate-200">
            <h2 class="text-md font-bold text-slate-700">📅 Lịch Thi Đấu (Giờ VN)</h2>
            <span class="text-xs bg-slate-800 text-white px-2 py-1 rounded font-bold shadow" id="matchCount">Nạp dữ liệu...</span>
        </div>
        <div id="matchesContainer"></div>
    </div>

    <div id="simulationModal" class="fixed inset-0 bg-slate-900 bg-opacity-60 hidden z-50 flex items-end sm:items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl h-5/6 sm:h-auto overflow-hidden flex flex-col transform transition-all shadow-2xl">
            
            <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                <h3 class="text-lg font-black text-slate-800" id="modalMatchTitle">Chi Tiết Trận Đấu</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-800 text-3xl font-bold w-8 h-8 flex items-center justify-center bg-slate-200 rounded-full">&times;</button>
            </div>

            <div class="flex border-b border-slate-200 bg-white">
                <button onclick="switchTab('ai')" id="tab-ai" class="w-1/2 py-3 text-sm text-center tab-active focus:outline-none">🤖 AI Dự Đoán</button>
                <button onclick="switchTab('result')" id="tab-result" class="w-1/2 py-3 text-sm text-center tab-inactive focus:outline-none">📝 Kết Quả & Elo</button>
            </div>

            <div class="p-5 overflow-y-auto flex-1 bg-white">
                <div id="panel-ai">
                    <div id="modalContentAI" class="mb-5"></div>
                    <button id="runBtn" onclick="runSimulation()" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-slate-800 flex justify-center items-center gap-2 transition-all">
                        <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        Chạy Mô Phỏng Định Lượng
                    </button>
                    <div id="resultArea" class="mt-5 hidden">
                        <div class="flex items-center justify-center gap-2 text-blue-600 font-bold mb-4 hidden" id="loadingState">
                            <div class="loader"></div> <span id="loadingText" class="text-sm">Đang kết nối API...</span>
                        </div>
                        <div id="aiOutput" class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-sm leading-relaxed text-slate-700 shadow-inner"></div>
                    </div>
                </div>

                <div id="panel-result" class="hidden">
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-5">
                        <div class="text-center text-xs font-bold text-slate-500 mb-3 uppercase tracking-wider">Cập nhật tỷ số thực tế</div>
                        <div class="flex justify-between items-center gap-4">
                            <div class="w-2/5 flex flex-col items-center">
                                <span class="text-3xl mb-2" id="res-hFlag"></span>
                                <span class="font-bold text-slate-800 text-sm truncate w-full text-center" id="res-hName"></span>
                                <input type="number" id="inputHomeScore" class="w-16 h-12 text-center text-xl font-black bg-white border-2 border-slate-300 rounded-lg mt-2 focus:border-blue-500 focus:outline-none" min="0">
                            </div>
                            <div class="w-1/5 text-center text-2xl font-black text-slate-300">-</div>
                            <div class="w-2/5 flex flex-col items-center">
                                <span class="text-3xl mb-2" id="res-aFlag"></span>
                                <span class="font-bold text-slate-800 text-sm truncate w-full text-center" id="res-aName"></span>
                                <input type="number" id="inputAwayScore" class="w-16 h-12 text-center text-xl font-black bg-white border-2 border-slate-300 rounded-lg mt-2 focus:border-blue-500 focus:outline-none" min="0">
                            </div>
                        </div>
                    </div>
                    <button onclick="saveRealResult()" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-green-500 flex justify-center items-center gap-2 transition-all">
                        💾 Lưu Kết Quả & Cập Nhật Elo
                    </button>
                    
                    <div id="eloUpdateBox" class="mt-5 hidden bg-green-50 p-4 rounded-xl border border-green-200 text-sm text-green-800">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. GLOBAL STATE & LOCAL STORAGE ---
        let teamElos = JSON.parse(localStorage.getItem('wc_team_elos')) || {};
        let matchesData = JSON.parse(localStorage.getItem('wc_matches_data')) || [];
        let currentMatchId = null;

        const baseTeams = [
            // Cập nhật Elos sát thực tế tháng 6/2026 
            {n:"Mexico",f:"\uD83C\uDDF2\uD83C\uDDFD",e:1640}, {n:"South Africa",f:"\uD83C\uDDFF\uD83C\uDDE6",e:1430}, {n:"South Korea",f:"\uD83C\uDDF0\uD83C\uDDF7",e:1570}, {n:"Czechia",f:"\uD83C\uDDE8\uD83C\uDDFF",e:1515},
            {n:"Canada",f:"\uD83C\uDDE8\uD83C\uDDE6",e:1585}, {n:"Bosnia",f:"\uD83C\uDDE7\uD83C\uDDE6",e:1440}, {n:"Qatar",f:"\uD83C\uDDF6\uD83C\uDDE6",e:1450}, {n:"Switzerland",f:"\uD83C\uDDE8\uD83C\uDDED",e:1610},
            {n:"Brazil",f:"\uD83C\uDDE7\uD83C\uDDF7",e:1835}, {n:"Morocco",f:"\uD83C\uDDF2\uD83C\uDDE6",e:1670}, {n:"Haiti",f:"\uD83C\uDDED\uD83C\uDDF9",e:1355}, {n:"Scotland",f:"\uD83C\uDFF4\uDB40\uDC67\uDB40\uDC62\uDB40\uDC73\uDB40\uDC63\uDB40\uDC74\uDB40\uDC7F",e:1500},
            {n:"USA",f:"\uD83C\uDDFA\uD83C\uDDF8",e:1680}, {n:"Paraguay",f:"\uD83C\uDDF5\uD83C\uDDFE",e:1485}, {n:"Australia",f:"\uD83C\uDDE6\uD83C\uDDFA",e:1550}, {n:"Turkey",f:"\uD83C\uDDF9\uD83C\uDDF7",e:1530},
            {n:"Germany",f:"\uD83C\uDDE9\uD83C\uDDEA",e:1720}, {n:"Curacao",f:"\uD83C\uDDE8\uD83C\uDDFC",e:1330}, {n:"Ivory Coast",f:"\uD83C\uDDE8\uD83C\uDDEE",e:1515}, {n:"Ecuador",f:"\uD83C\uDDEA\uD83C\uDDE8",e:1590},
            {n:"Netherlands",f:"\uD83C\uDDF3\uD83C\uDDF1",e:1760}, {n:"Japan",f:"\uD83C\uDDEF\uD83C\uDDF5",e:1630}, {n:"Sweden",f:"\uD83C\uDDF8\uD83C\uDDEA",e:1680}, {n:"Tunisia",f:"\uD83C\uDDF9\uD83C\uDDF3",e:1505},
            {n:"Belgium",f:"\uD83C\uDDE7\uD83C\uDDEA",e:1780}, {n:"Egypt",f:"\uD83C\uDDEA\uD83C\uDDEC",e:1510}, {n:"Iran",f:"\uD83C\uDDEE\uD83C\uDDF7",e:1540}, {n:"New Zealand",f:"\uD83C\uDDF3\uD83C\uDDFF",e:1395},
            {n:"Spain",f:"\uD83C\uDDEA\uD83C\uDDF8",e:1820}, {n:"Cape Verde",f:"\uD83C\uDDE8\uD83C\uDDFB",e:1430}, {n:"Saudi Arabia",f:"\uD83C\uDDF8\uD83C\uDDE6",e:1445}, {n:"Uruguay",f:"\uD83C\uDDFA\uD83C\uDDFE",e:1675},
            {n:"France",f:"\uD83C\uDDEB\uD83C\uDDF7",e:1850}, {n:"Senegal",f:"\uD83C\uDDF8\uD83C\uDDF3",e:1620}, {n:"Iraq",f:"\uD83C\uDDEE\uD83C\uDDF6",e:1435}, {n:"Norway",f:"\uD83C\uDDF3\uD83C\uDDF4",e:1580},
            {n:"Argentina",f:"\uD83C\uDDE6\uD83C\uDDF7",e:1865}, {n:"Algeria",f:"\uD83C\uDDE9\uD83C\uDDFF",e:1555}, {n:"Austria",f:"\uD83C\uDDE6\uD83C\uDDF9",e:1600}, {n:"Jordan",f:"\uD83C\uDDEF\uD83C\uDDF4",e:1470},
            {n:"Portugal",f:"\uD83C\uDDF5\uD83C\uDDF9",e:1790}, {n:"DR Congo",f:"\uD83C\uDDE8\uD83C\uDDE9",e:1475}, {n:"Uzbekistan",f:"\uD83C\uDDFA\uD83C\uDDFF",e:1500}, {n:"Colombia",f:"\uD83C\uDDE8\uD83C\uDDF4",e:1660},
            {n:"England",f:"\uD83C\uDFF4\uDB40\uDC67\uDB40\uDC62\uDB40\uDC65\uDB40\uDC6E\uDB40\uDC67\uDB40\uDC7F",e:1825}, {n:"Croatia",f:"\uD83C\uDDED\uD83C\uDDF7",e:1710}, {n:"Ghana",f:"\uD83C\uDDEC\uD83C\uDDED",e:1485}, {n:"Panama",f:"\uD83C\uDDF5\uD83C\uDDE6",e:1455}
        ];

        function initData() {
            if (Object.keys(teamElos).length === 0) {
                baseTeams.forEach(t => teamElos[t.n] = t.e);
                localStorage.setItem('wc_team_elos', JSON.stringify(teamElos));
            }
            if (matchesData.length === 0) {
                generateSchedule();
            }
            renderMatchesUI();
        }

        function resetData() {
            localStorage.removeItem('wc_team_elos');
            localStorage.removeItem('wc_matches_data');
            teamElos = {}; matchesData = [];
            initData();
        }

        function formatDateVN(date) {
            const pad = n => n < 10 ? '0' + n : n;
            return `${pad(date.getHours())}:${pad(date.getMinutes())} ${pad(date.getDate())}/${pad(date.getMonth() + 1)}`;
        }

        function generateSchedule() {
            const venues = ["Azteca", "MetLife", "SoFi", "AT&T", "BC Place", "BMO", "Mercedes", "Lumen"];
            let id = 1; let startDate = new Date(2026, 5, 12, 2, 0);

            for(let round=0; round<3; round++) {
                for(let g=0; g<12; g++) {
                    let groupLetter = String.fromCharCode(65 + g);
                    let t = baseTeams.slice(g*4, g*4+4);
                    let pairs = round === 0 ? [[0,1], [2,3]] : round === 1 ? [[0,2], [1,3]] : [[0,3], [1,2]];
                    
                    pairs.forEach(p => {
                        matchesData.push({
                            id: id++, time: formatDateVN(startDate), stage: `Bảng ${groupLetter}`, venue: venues[id % 8],
                            hName: t[p[0]].n, hFlag: t[p[0]].f, aName: t[p[1]].n, aFlag: t[p[1]].f,
                            aiPred: null, realScore: null
                        });
                        startDate.setHours(startDate.getHours() + 3);
                    });
                }
            }

            const koStages = [{n: "Vòng 1/16", c: 16}, {n: "Vòng 1/8", c: 8}, {n: "Tứ Kết", c: 4}, {n: "Bán Kết", c: 2}, {n: "Hạng 3", c: 1}, {n: "CHUNG KẾT", c: 1}];
            koStages.forEach(stage => {
                startDate.setDate(startDate.getDate() + 1);
                for(let i=0; i<stage.c; i++) {
                    matchesData.push({
                        id: id++, time: formatDateVN(startDate), stage: stage.n, venue: venues[id % 8],
                        hName: `Win Match ${id-stage.c-i-1}`, hFlag: "❓", aName: `Win Match ${id-stage.c-i}`, aFlag: "❓",
                        aiPred: null, realScore: null
                    });
                    startDate.setHours(startDate.getHours() + 4);
                }
            });
            localStorage.setItem('wc_matches_data', JSON.stringify(matchesData));
        }

        // --- 2. RENDER UI ---
        function renderMatchesUI() {
            const container = document.getElementById("matchesContainer");
            document.getElementById("matchCount").innerText = `${matchesData.length}/104 Trận`;
            container.innerHTML = "";

            matchesData.forEach(m => {
                // Lấy Elo hiện tại (Live) từ memory thay vì tĩnh
                let currentHElo = teamElos[m.hName] ? Math.round(teamElos[m.hName]) : "-";
                let currentAElo = teamElos[m.aName] ? Math.round(teamElos[m.aName]) : "-";
                
                let scoreDisplay = m.realScore ? `<div class="text-xl font-black text-blue-700 bg-blue-100 px-3 py-1 rounded-full">${m.realScore.h} - ${m.realScore.a}</div>` : `<div class="text-xs font-black text-slate-200 bg-slate-50 px-3 py-1 rounded-full">VS</div>`;

                let aiBadge = m.aiPred ? `<span class="absolute -top-2 -right-2 bg-purple-500 text-white text-[9px] px-1.5 py-0.5 rounded-md font-bold shadow-sm">AI Analyzed</span>` : '';

                const card = document.createElement("div");
                card.className = "bg-white p-4 rounded-xl shadow-sm mb-3 border-l-4 border-slate-800 cursor-pointer hover:bg-slate-50 transition-colors relative";
                card.onclick = () => openModal(m.id);
                card.innerHTML = `
                    ${aiBadge}
                    <div class="flex justify-between items-center mb-3 border-b border-slate-100 pb-2">
                        <div class="text-xs font-bold text-white ${m.realScore ? 'bg-green-600' : 'bg-slate-800'} px-2 py-0.5 rounded shadow-sm">Trận ${m.id}</div>
                        <div class="text-[10px] sm:text-xs font-semibold text-slate-500 flex items-center gap-2">
                            <span>🕒 ${m.time}</span>
                            <span class="text-blue-500">📍 ${m.venue}</span>
                        </div>
                    </div>
                    <div class="text-[10px] font-black text-slate-300 text-center mb-2 tracking-widest uppercase">${m.stage}</div>
                    <div class="flex justify-between items-center">
                        <div class="text-center w-2/5 flex flex-col items-center">
                            <span class="text-2xl mb-1">${m.hFlag}</span>
                            <div class="font-bold text-slate-800 text-sm truncate w-full">${m.hName}</div>
                            <div class="text-[10px] text-slate-400 font-mono">Elo: ${currentHElo}</div>
                        </div>
                        <div class="w-1/5 flex justify-center">${scoreDisplay}</div>
                        <div class="text-center w-2/5 flex flex-col items-center">
                            <span class="text-2xl mb-1">${m.aFlag}</span>
                            <div class="font-bold text-slate-800 text-sm truncate w-full">${m.aName}</div>
                            <div class="text-[10px] text-slate-400 font-mono">Elo: ${currentAElo}</div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- 3. TABS & MODAL LOGIC ---
        function openModal(id) {
            currentMatchId = id;
            let m = matchesData.find(x => x.id === id);
            
            document.getElementById("simulationModal").classList.remove("hidden");
            switchTab('ai'); // Default tab

            let currentHElo = teamElos[m.hName] ? Math.round(teamElos[m.hName]) : 1600;
            let currentAElo = teamElos[m.aName] ? Math.round(teamElos[m.aName]) : 1600;

            // Setup AI Panel
            document.getElementById("modalContentAI").innerHTML = `
                <div class="flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div class="text-center w-2/5 flex flex-col items-center"><span class="text-3xl">${m.hFlag}</span><div class="font-bold text-slate-800 text-sm mt-1">${m.hName}</div><div class="text-xs text-blue-600">Elo: ${currentHElo}</div></div>
                    <div class="font-black text-slate-300 w-1/5 text-center text-xl">VS</div>
                    <div class="text-center w-2/5 flex flex-col items-center"><span class="text-3xl">${m.aFlag}</span><div class="font-bold text-slate-800 text-sm mt-1">${m.aName}</div><div class="text-xs text-blue-600">Elo: ${currentAElo}</div></div>
                </div>
            `;

            if(m.aiPred) {
                document.getElementById("resultArea").classList.remove("hidden");
                document.getElementById("aiOutput").innerHTML = `<div class="text-xs text-purple-600 font-bold mb-2">Đã lưu kết quả dự đoán trước đó:</div>` + m.aiPred;
            } else {
                document.getElementById("resultArea").classList.add("hidden");
                document.getElementById("aiOutput").innerHTML = "";
            }

            // Setup Result Panel
            document.getElementById("res-hFlag").innerText = m.hFlag;
            document.getElementById("res-hName").innerText = m.hName;
            document.getElementById("res-aFlag").innerText = m.aFlag;
            document.getElementById("res-aName").innerText = m.aName;
            
            document.getElementById("inputHomeScore").value = m.realScore ? m.realScore.h : "";
            document.getElementById("inputAwayScore").value = m.realScore ? m.realScore.a : "";
            document.getElementById("eloUpdateBox").classList.add("hidden");
        }

        function switchTab(tab) {
            if(tab === 'ai') {
                document.getElementById('tab-ai').className = "w-1/2 py-3 text-sm text-center tab-active focus:outline-none";
                document.getElementById('tab-result').className = "w-1/2 py-3 text-sm text-center tab-inactive focus:outline-none";
                document.getElementById('panel-ai').classList.remove('hidden');
                document.getElementById('panel-result').classList.add('hidden');
            } else {
                document.getElementById('tab-result').className = "w-1/2 py-3 text-sm text-center tab-active focus:outline-none";
                document.getElementById('tab-ai').className = "w-1/2 py-3 text-sm text-center tab-inactive focus:outline-none";
                document.getElementById('panel-result').classList.remove('hidden');
                document.getElementById('panel-ai').classList.add('hidden');
            }
        }

        function closeModal() { document.getElementById("simulationModal").classList.add("hidden"); }

        // --- 4. CẬP NHẬT ELO THUẬT TOÁN (TOÁN HỌC) ---
        function saveRealResult() {
            let hScore = parseInt(document.getElementById("inputHomeScore").value);
            let aScore = parseInt(document.getElementById("inputAwayScore").value);
            
            if(isNaN(hScore) || isNaN(aScore)) { alert("Vui lòng nhập tỷ số hợp lệ!"); return; }

            let m = matchesData.find(x => x.id === currentMatchId);
            m.realScore = { h: hScore, a: aScore };

            // Nếu đây là các đội đã xác định, thực hiện tính toán Elo
            if(teamElos[m.hName] && teamElos[m.aName]) {
                let rH = teamElos[m.hName];
                let rA = teamElos[m.aName];
                
                // 1. Kỳ vọng
                let eH = 1 / (1 + Math.pow(10, (rA - rH)/400));
                let eA = 1 - eH;
                
                // 2. Thực tế
                let sH = hScore > aScore ? 1 : (hScore === aScore ? 0.5 : 0);
                let sA = 1 - sH;
                
                // 3. Trọng số bàn thắng (Goal diff multiplier)
                let diff = Math.abs(hScore - aScore);
                let G = 1;
                if(diff === 2) G = 1.5;
                else if (diff >= 3) G = (11 + diff) / 8;

                // 4. K-factor (WC = 60)
                let K = 60;
                
                let deltaH = K * G * (sH - eH);
                let deltaA = K * G * (sA - eA);

                teamElos[m.hName] += deltaH;
                teamElos[m.aName] += deltaA;

                localStorage.setItem('wc_team_elos', JSON.stringify(teamElos));

                let box = document.getElementById("eloUpdateBox");
                box.classList.remove("hidden");
                box.innerHTML = `
                    <div class="font-bold mb-1">Cập nhật Elo System thành công:</div>
                    <div>${m.hName}: ${Math.round(rH)} <span class="${deltaH > 0 ? 'text-green-600' : 'text-red-600'}">(${deltaH > 0 ? '+' : ''}${deltaH.toFixed(1)})</span> ➔ <strong>${Math.round(teamElos[m.hName])}</strong></div>
                    <div>${m.aName}: ${Math.round(rA)} <span class="${deltaA > 0 ? 'text-green-600' : 'text-red-600'}">(${deltaA > 0 ? '+' : ''}${deltaA.toFixed(1)})</span> ➔ <strong>${Math.round(teamElos[m.aName])}</strong></div>
                `;
            }

            localStorage.setItem('wc_matches_data', JSON.stringify(matchesData));
            renderMatchesUI();
        }

        // --- 5. AI GEMINI PREDICTION ---
        async function runSimulation() {
            const apiKey = document.getElementById("apiKey").value.trim();
            if (!apiKey) { alert("Vui lòng nhập API Key!"); return; }

            let m = matchesData.find(x => x.id === currentMatchId);
            let currentHElo = teamElos[m.hName] ? Math.round(teamElos[m.hName]) : 1600;
            let currentAElo = teamElos[m.aName] ? Math.round(teamElos[m.aName]) : 1600;

            document.getElementById("resultArea").classList.remove("hidden");
            document.getElementById("loadingState").classList.remove("hidden");
            document.getElementById("aiOutput").innerHTML = "";
            document.getElementById("runBtn").disabled = true;

            const prompt = `Phân tích định lượng trận: Chủ nhà ${m.hName} (Elo ${currentHElo}) vs Khách ${m.aName} (Elo ${currentAElo}). Định dạng: 1. % Thắng/Hòa/Thua. 2. Top 3 tỷ số. 3. Nhận định ngắn.`;

            // Bắt buộc sử dụng gemini-1.5-flash chuẩn Google API
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                if(data.error) throw new Error(data.error.message);

                let resultText = data.candidates[0].content.parts[0].text.replace(/\*\*(.*?)\*\*/g, '<strong class="text-slate-900">$1</strong>').replace(/\*/g, '<br>•').replace(/\n/g, '<br>');
                
                m.aiPred = resultText;
                localStorage.setItem('wc_matches_data', JSON.stringify(matchesData));

                document.getElementById("aiOutput").innerHTML = `<div class="text-xs text-blue-500 mb-2 font-mono">Xử lý bởi: gemini-1.5-flash</div>` + resultText;
            } catch (error) {
                document.getElementById("aiOutput").innerHTML = `<span class="text-red-500 font-bold">Lỗi: API Key bị từ chối truy cập.</span><br>Vui lòng đăng nhập Google AI Studio và tạo một "New Project" Key.`;
            }

            document.getElementById("loadingState").classList.add("hidden");
            document.getElementById("runBtn").disabled = false;
        }

        window.onload = () => {
            const savedKey = localStorage.getItem("gemini_wc_api_key");
            if(savedKey) document.getElementById("apiKey").value = savedKey;
            initData();
        };

        function saveApiKey() {
            const key = document.getElementById("apiKey").value.trim();
            if(!key) return;
            localStorage.setItem("gemini_wc_api_key", key);
            document.getElementById("keyStatus").classList.remove("hidden");
            setTimeout(() => document.getElementById("keyStatus").classList.add("hidden"), 3000);
        }
    </script>
</body>
</html>
