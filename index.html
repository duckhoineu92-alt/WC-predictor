<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Predictor - WC 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased pb-10">

    <div class="bg-blue-900 text-white p-4 shadow-md sticky top-0 z-50">
        <h1 class="text-xl font-bold text-center mb-3">⚽ WC 2026 AI Predictor</h1>
        <div class="max-w-md mx-auto">
            <div class="flex gap-2">
                <input type="password" id="apiKey" placeholder="Nhập Gemini API Key..." 
                    class="w-full px-4 py-2 rounded text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                <button onclick="saveApiKey()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded font-bold text-sm whitespace-nowrap transition-colors">
                    Lưu Key
                </button>
            </div>
            <p id="keyStatus" class="text-xs text-green-400 mt-1 hidden text-center">✅ Đã lưu API Key vào bộ nhớ thiết bị!</p>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4" id="match-list">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold text-gray-700">📅 Lịch Thi Đấu (Giờ VN)</h2>
            <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded font-bold" id="matchCount">0 Trận</span>
        </div>
    </div>

    <div id="simulationModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-end sm:items-center justify-center">
        <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-6 h-5/6 sm:h-auto overflow-y-auto transform transition-all relative">
            <div class="flex justify-between items-center mb-4 sticky top-0 bg-white z-10 pb-2 border-b">
                <h3 class="text-xl font-bold text-gray-800" id="modalTitle">Phân Tích AI</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-800 text-3xl font-bold">&times;</button>
            </div>
            
            <div id="modalContent" class="mb-6"></div>

            <button id="runBtn" onclick="runSimulation()" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold py-3 rounded-xl shadow-lg hover:opacity-90 flex justify-center items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                Chạy 10,000 Mô phỏng Monte Carlo
            </button>

            <div id="resultArea" class="mt-6 hidden">
                <div class="flex items-center justify-center gap-2 text-blue-600 font-bold mb-4 hidden" id="loadingState">
                    <div class="loader"></div> Đang kết nối mô hình định lượng...
                </div>
                <div id="aiOutput" class="bg-gray-50 p-4 rounded-xl border border-gray-200 text-sm leading-relaxed text-gray-700"></div>
            </div>
        </div>
    </div>

    <script>
        window.onload = () => {
            const savedKey = localStorage.getItem("gemini_wc_api_key");
            if(savedKey) document.getElementById("apiKey").value = savedKey;
            renderMatches();
        };

        function saveApiKey() {
            const key = document.getElementById("apiKey").value.trim();
            if(!key) {
                alert("Vui lòng nhập Key trước khi lưu!");
                return;
            }
            localStorage.setItem("gemini_wc_api_key", key);
            const status = document.getElementById("keyStatus");
            status.classList.remove("hidden");
            setTimeout(() => status.classList.add("hidden"), 3000);
        }

        // CẬP NHẬT DATABASE 12 TRẬN ĐẦU TIÊN (Chuẩn FIFA Giờ Việt Nam)
        const matches = [
            { id: 1, time: "12/06/2026 02:00", group: "Bảng A", home: "Mexico", homeElo: 1650, away: "South Africa", awayElo: 1410 },
            { id: 2, time: "12/06/2026 09:00", group: "Bảng A", home: "South Korea", homeElo: 1560, away: "Czech Republic", awayElo: 1510 },
            { id: 3, time: "13/06/2026 02:00", group: "Bảng B", home: "Canada", homeElo: 1580, away: "Bosnia & Herzegovina", awayElo: 1450 },
            { id: 4, time: "13/06/2026 08:00", group: "Bảng D", home: "USA", homeElo: 1670, away: "Paraguay", awayElo: 1480 },
            { id: 5, time: "14/06/2026 02:00", group: "Bảng B", home: "Qatar", homeElo: 1440, away: "Switzerland", awayElo: 1600 },
            { id: 6, time: "14/06/2026 05:00", group: "Bảng C", home: "Brazil", homeElo: 1830, away: "Morocco", awayElo: 1660 },
            { id: 7, time: "14/06/2026 08:00", group: "Bảng C", home: "Haiti", homeElo: 1350, away: "Scotland", awayElo: 1490 },
            { id: 8, time: "14/06/2026 11:00", group: "Bảng D", home: "Australia", homeElo: 1540, away: "Turkey", awayElo: 1520 },
            { id: 9, time: "15/06/2026 00:00", group: "Bảng E", home: "Germany", homeElo: 1710, away: "Curaçao", awayElo: 1320 },
            { id: 10, time: "15/06/2026 03:00", group: "Bảng F", home: "Netherlands", homeElo: 1750, away: "Japan", awayElo: 1620 },
            { id: 11, time: "15/06/2026 06:00", group: "Bảng E", home: "Ivory Coast", homeElo: 1510, away: "Ecuador", awayElo: 1580 },
            { id: 12, time: "15/06/2026 09:00", group: "Bảng F", home: "Sweden", homeElo: 1690, away: "Tunisia", awayElo: 1500 }
        ];

        let currentMatch = null;

        function renderMatches() {
            const list = document.getElementById("match-list");
            document.getElementById("matchCount").innerText = `${matches.length}/104 Trận`;
            
            matches.forEach(m => {
                const card = document.createElement("div");
                card.className = "bg-white p-4 rounded-xl shadow-sm mb-3 border border-gray-100 cursor-pointer hover:border-blue-300 transition-colors";
                card.onclick = () => openModal(m);
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <div class="text-xs font-bold text-gray-500 bg-gray-100 px-2 py-1 rounded">Trận ${m.id}</div>
                        <div class="text-xs font-bold text-blue-600">${m.time} • ${m.group}</div>
                    </div>
                    <div class="flex justify-between items-center">
                        <div class="text-center w-2/5">
                            <div class="font-bold text-gray-800 truncate">${m.home}</div>
                            <div class="text-xs text-blue-500">Elo: ${m.homeElo}</div>
                        </div>
                        <div class="text-sm font-black text-gray-300 w-1/5 text-center">VS</div>
                        <div class="text-center w-2/5">
                            <div class="font-bold text-gray-800 truncate">${m.away}</div>
                            <div class="text-xs text-blue-500">Elo: ${m.awayElo}</div>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function openModal(match) {
            currentMatch = match;
            document.getElementById("simulationModal").classList.remove("hidden");
            document.getElementById("resultArea").classList.add("hidden");
            document.getElementById("modalContent").innerHTML = `
                <div class="flex justify-between items-center bg-gray-50 p-4 rounded-lg border border-gray-200 shadow-inner">
                    <div class="text-center w-2/5"><div class="text-lg font-bold text-blue-800">${match.home}</div></div>
                    <div class="font-black text-gray-400 w-1/5 text-center">VS</div>
                    <div class="text-center w-2/5"><div class="text-lg font-bold text-red-800">${match.away}</div></div>
                </div>
            `;
        }

        function closeModal() {
            document.getElementById("simulationModal").classList.add("hidden");
        }

        async function runSimulation() {
            const apiKey = document.getElementById("apiKey").value.trim();
            if (!apiKey) {
                alert("Bạn chưa nhập API Key! Vui lòng nhập và bấm 'Lưu Key' ở trên cùng.");
                return;
            }

            document.getElementById("resultArea").classList.remove("hidden");
            document.getElementById("loadingState").classList.remove("hidden");
            document.getElementById("aiOutput").innerHTML = "";
            document.getElementById("runBtn").disabled = true;
            document.getElementById("runBtn").classList.add("opacity-50");

            const prompt = `Bạn là một AI Data Scientist mảng bóng đá. 
            Thực hiện định lượng tỷ lệ kết quả dựa trên Elo rating: 
            Chủ nhà: ${currentMatch.home} (Elo ${currentMatch.homeElo}) 
            Khách: ${currentMatch.away} (Elo ${currentMatch.awayElo}) 
            Yêu cầu format trả về ngắn gọn: 
            - 🎯 Tỷ lệ Thắng / Hòa / Thua (dạng phần trăm %) 
            - ⚽ Top 3 tỷ số có xác suất xảy ra cao nhất 
            - 💡 Chốt 1 câu nhận định sắc bén dựa trên dữ liệu.`;

            try {
                // ĐÃ FIX BUGS: Đổi endpoint thành gemini-1.5-flash-latest để khắc phục lỗi 404 Not Found
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { temperature: 0.2 }
                    })
                });

                const data = await response.json();
                if(data.error) throw new Error(data.error.message);

                let resultText = data.candidates[0].content.parts[0].text;
                resultText = resultText.replace(/\*\*(.*?)\*\*/g, '<strong class="text-gray-900">$1</strong>');
                resultText = resultText.replace(/\*/g, '<br>•');
                resultText = resultText.replace(/\n/g, '<br>');

                document.getElementById("aiOutput").innerHTML = resultText;
            } catch (error) {
                document.getElementById("aiOutput").innerHTML = `<span class="text-red-500 font-bold">Lỗi API:</span> ${error.message}`;
            } finally {
                document.getElementById("loadingState").classList.add("hidden");
                document.getElementById("runBtn").disabled = false;
                document.getElementById("runBtn").classList.remove("opacity-50");
            }
        }
    </script>
</body>
</html>
